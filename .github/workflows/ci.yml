name: CI

# Jalan di tiap push dan PR ke main/develop — menegakkan gate CONTRIBUTING.md §6
# (ruff format, ruff check, pytest) sebelum kode masuk branch bersama.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest
