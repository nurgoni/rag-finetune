[project]
name = "rag-finetune"
version = "0.1.0"
description = "Rewrite terdidik FlashRAG: toolkit RAG modular yang alurnya bisa dipahami end-to-end"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Annur Afgoni", email = "afgoniannur@gmail.com" }]

# Dependensi inti sengaja ringan: harus bisa di-install, dibaca, dan dites
# tanpa mengunduh PyTorch (NFR-7, ADR-008).
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
# Retrieval dense: FAISS + model embedding. Berat, karena itu opsional.
dense = ["faiss-cpu>=1.8", "sentence-transformers>=3.0"]
# Retrieval sparse: bm25s murni Python, tanpa JVM seperti Pyserini (ADR-006).
sparse = ["bm25s>=0.2"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

# Catatan: [project.scripts] belum didaftarkan. Entrypoint `rag-finetune`
# baru lahir di F10 bersama cli.py; mendaftarkannya sekarang berarti manifest
# menjanjikan modul yang belum ada.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_finetune"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle error
    "W",   # pycodestyle warning
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations — type hint wajib (AGENTS.md §5)
    "D",   # pydocstyle — docstring wajib (AGENTS.md §2 langkah 2)
    "RET", # flake8-return — mendorong early return, melawan nesting (AGENTS.md §2 langkah 4)
    "C90", # mccabe — kompleksitas
]
ignore = [
    "D203", # bentrok dengan D211
    "D213", # bentrok dengan D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
# Nesting > 2 level biasanya menembus angka ini (AGENTS.md §2 langkah 4).
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# Test tidak butuh docstring lengkap; nama test sudah jadi dokumentasinya.
"tests/**" = ["D100", "D103", "ANN201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: butuh service eksternal (Ollama, model nyata). Tidak jalan secara default.",
]
